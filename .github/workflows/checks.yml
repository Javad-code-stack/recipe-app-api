# This is a GitHub Actions workflow file
# It tells GitHub how to test our code automatically

name: Checks # The name of this workflow

# When should this run?
# This will run whenever someone pushes code to the repository
on: [push]

jobs:
    test-lint:
        # What kind of computer should run these tests?
        # We're using the latest Ubuntu Linux machine
        runs-on: ubuntu-latest

        steps:
            # Step 1: Get our code from GitHub
            # This downloads all our code to the test machine
            - name: Checkout
              uses: actions/checkout@v3 # Using the official GitHub checkout tool

            # Step 2: Log in to Docker Hub
            # We need this to pull/push Docker images if needed
            # Uses secret passwords stored in GitHub settings
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USER }} # Gets username from GitHub secrets
                  password: ${{ secrets.DOCKERHUB_TOKEN }} # Gets password from GitHub secrets

            # Step 3: Install Docker Compose
            # Needed to run our app in containers during testing
            - name: Install docker-compose
              run: |
                  sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                  sudo chmod +x /usr/local/bin/docker-compose

            # Step 4: Run our tests inside the app container
            # First waits for database to be ready, then runs all tests
            - name: Test
              run: docker-compose run --rm app sh -c "python manage.py wait_for_db && python manage.py test"

            # Step 5: Check code style using flake8 linter
            # Makes sure our code follows good style guidelines
            - name: Lint
              run: docker-compose run --rm app sh -c "flake8"
